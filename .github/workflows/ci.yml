name: Playwright CI

on:
  push:
    branches:
      - developer
    paths:
      - "src/**"
      - "tests/**"
      - "checks/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "playwright.checks.config.ts"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# Runs use the same Rakuten account; do not overlap or cancel point claims.
concurrency:
  group: rakuten-point-playwright
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check TypeScript
        run: npm run check

      - name: Run regression checks
        run: npm run test:checks

      - name: Upload Playwright report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
